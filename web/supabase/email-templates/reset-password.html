<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password — Growth OS</title>
  </head>
  <body style="margin:0;padding:0;background-color:#1e1f22;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#1e1f22;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;margin-bottom:20px;text-align:center;">
            <tr>
              <td align="center">
                <img
                  src="https://i.imgur.com/Q35Y6QO.png"
                  alt="Growth OS"
                  width="140"
                  style="display:block;width:140px;max-width:100%;height:auto;border:0;margin:0 auto;"
                />
              </td>
            </tr>
          </table>
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background-color:#2b2d31;border-radius:12px;border:1px solid #3f4147;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 0;text-align:center;">
                <h1 style="margin:0 0 8px;font-size:22px;font-weight:600;color:#f2f3f5;letter-spacing:-0.02em;">
                  Reset your password
                </h1>
                <p style="margin:0;font-size:14px;line-height:1.6;color:#b5bac1;">
                  We received a request to reset your password. Follow the link below to choose a new one.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 28px 28px;text-align:center;">
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/settings"
                  style="display:inline-block;background-color:#5865f2;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 24px;border-radius:8px;"
                >
                  Reset password
                </a>
                <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#949ba4;">
                  If you didn&apos;t request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px 24px;border-top:1px solid #3f4147;text-align:center;">
                <p style="margin:0;font-size:11px;color:#72767d;">
                  Growth OS · TikTok growth workspace
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

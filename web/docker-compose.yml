services:
  postgres:
    image: postgres:16-alpine
    container_name: growthos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: growthos
    volumes:
      - growthos_pg_data:/var/lib/postgresql/data

volumes:
  growthos_pg_data:
